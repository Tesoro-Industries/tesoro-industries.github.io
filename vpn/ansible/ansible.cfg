# Run from this directory via the Makefile (`make configure`).
[defaults]
inventory = ../local/inventory.yml
roles_path = ./roles
collections_path = ./collections
interpreter_python = /usr/bin/python3
stdout_callback = default
result_format = yaml
nocows = true
retry_files_enabled = false
# Never print secrets: tasks touching keys also set no_log.
display_args_to_stdout = false

[ssh_connection]
# Connection details (host, user, key, known_hosts) come from the generated
# ssh config, the same one bin/vpn uses.
ssh_args = -F ../local/ssh_config -o ControlMaster=auto -o ControlPersist=60s
pipelining = true
