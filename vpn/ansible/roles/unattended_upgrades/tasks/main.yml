---
- name: Enable periodic unattended upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Configure automatic reboots
  ansible.builtin.template:
    src: 52vpn-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52vpn-unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Enable unattended-upgrades service and apt timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - unattended-upgrades.service
    - apt-daily.timer
    - apt-daily-upgrade.timer
