---
# Ubuntu 24.04 uses socket activation; reload the running daemon if there is
# one, otherwise the next connection starts sshd with the new config.
# The systemd module has no try-reload-or-restart; `reloaded` would start
# ssh.service even when socket activation has not started it yet.
- name: Reload sshd
  ansible.builtin.command: systemctl try-reload-or-restart ssh.service # noqa: command-instead-of-module
  changed_when: true
