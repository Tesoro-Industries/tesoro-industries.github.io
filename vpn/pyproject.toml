# Tooling configuration only; this is not an installable package.
# bin/vpn runs on the operator's laptop (macOS ships Python 3.9), so target 3.9.

[tool.ruff]
line-length = 100
target-version = "py39"
extend-include = ["bin/vpn"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "EXE", "ISC"]
ignore = [
  "S603",  # subprocess without shell: all commands are argv lists by design
  "S607",  # partial executable paths (wg, ssh, age) are resolved via PATH deliberately
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: real-packet tests in network namespaces (root only)"]
